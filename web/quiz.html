<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đấu Trường Quiz &amp; Mini-Games – Học Thông Minh</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .hud-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin: 20px 0 18px;
      box-shadow: var(--shadow);
    }
    .hud-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .hud-pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      max-width: 820px;
      margin: 0 auto 40px;
    }
    .progress-track {
      height: 8px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0 18px;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      transition: width 0.25s ease;
    }
    .opt-list {
      display: grid;
      gap: 10px;
      margin: 16px 0;
    }
    .opt-btn {
      text-align: left;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .opt-btn.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }
    .opt-btn.correct {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.14);
      color: #047857;
    }
    .opt-btn.wrong {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.14);
      color: #b91c1c;
    }
    [data-theme="dark"] .opt-btn.correct { color: #34d399; }
    [data-theme="dark"] .opt-btn.wrong { color: #f87171; }
    .explain-box {
      background: var(--primary-soft);
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 8px;
      margin: 14px 0;
      font-size: 0.92rem;
    }
    .chrono-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 8px;
      margin-top: 16px;
    }
    .chrono-slot {
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px dashed var(--border);
      background: var(--surface-2);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
    }
    .chrono-slot.found {
      border-style: solid;
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.12);
      color: var(--text);
    }
    .num-tiles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 18px 0;
    }
    .num-tile {
      min-width: 58px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--primary-soft);
      border: 1px solid var(--primary);
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 800;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-badge">HT</span>
        <span>Học Thông Minh</span>
      </a>
      <div style="display:flex;align-items:center;gap:8px;">
        <a class="btn" href="index.html">← 60 Công cụ</a>
        <a class="btn btn-primary" href="exam.html" style="padding:7px 13px;font-size:0.84rem;">🏛️ Phòng Thi Online</a>
        <button class="icon-btn" id="soundToggleBtn" title="Bật/tắt âm thanh">🔊</button>
        <button class="icon-btn" id="themeToggleBtn" title="Đổi giao diện Sáng / Tối">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="hud-bar">
      <div class="hud-stats">
        <span class="hud-pill" id="hudRank">🏅 Tân binh</span>
        <span class="hud-pill" id="hudXp">⚡ 0 XP</span>
        <span class="hud-pill" id="hudDone">✅ 0 lượt chơi</span>
      </div>
      <button class="btn btn-primary" id="randomQuizBtn">🎲 Chọn Quiz ngẫu nhiên</button>
    </div>

    <div class="mode-tabs" id="modeTabs">
      <button class="chip active" data-mode="mcq">🧠 Trắc nghiệm theo chủ đề</button>
      <button class="chip" data-mode="match">🃏 Đấu trường Ghép Thẻ (Card Match)</button>
      <button class="chip" data-mode="sentence">🧩 Sắp Xếp Câu (Sentence Builder)</button>
      <button class="chip" data-mode="facts">💡 Em Có Biết? (Wiki Bách Khoa)</button>
      <button class="chip" data-mode="chrono">⏱️ Thử thách Thời gian (Chrono)</button>
      <button class="chip" data-mode="math24">🧮 Tính Nhanh (Le Compte est Bon)</button>
      <button class="chip" data-mode="daily">🌟 Câu hỏi mỗi ngày &amp; BXH</button>
    </div>


    <section class="quiz-card" id="quizStage"></section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="quiz.js"></script>
</body>
</html>
