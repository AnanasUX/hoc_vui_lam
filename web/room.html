<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng Chơi Chung Wi-Fi (Lớp Học LAN) – Học Thông Minh</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .lan-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin: 18px 0;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
    }
    .room-split {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 18px;
      margin-bottom: 36px;
    }
    .room-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .avatar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .avatar-btn {
      font-size: 1.35rem;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      cursor: pointer;
    }
    .avatar-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: scale(1.08);
    }
    .code-hero {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--primary);
      margin: 6px 0;
    }
    .player-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 16px 0;
    }
    .player-pill {
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .kahoot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }
    .k-btn {
      border: none;
      border-radius: 14px;
      padding: 18px 16px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .k-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .k-btn:disabled { cursor: default; opacity: 0.72; }
    .k-btn.k0 { background: #ef4444; }
    .k-btn.k1 { background: #3b82f6; }
    .k-btn.k2 { background: #f59e0b; }
    .k-btn.k3 { background: #10b981; }
    .k-btn.chosen { outline: 4px solid #0f172a; }
    .k-btn.is-correct { outline: 4px solid #10b981; opacity: 1 !important; }
    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-badge">HT</span>
        <span>Học Thông Minh</span>
      </a>
      <div style="display:flex;align-items:center;gap:8px;">
        <a class="btn" href="quiz.html">🎯 Quiz cá nhân</a>
        <a class="btn" href="index.html">← 60 Công cụ</a>
        <button class="icon-btn" id="themeToggleBtn" title="Đổi giao diện Sáng / Tối">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="lan-banner" id="lanBanner">
      <span>⏳ Đang kiểm tra kết nối máy chủ Wi-Fi lớp học...</span>
    </div>

    <div id="roomStage"></div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="room.js"></script>
</body>
</html>
